apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-store
  labels:
    app: game-store
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: game-store
    template:
      metadata:
        labels:
          app: game-store
      spec:
        containers:
          - name: game-store
            image: game-store:latest
            ports:
              - containerPort: 8080
        